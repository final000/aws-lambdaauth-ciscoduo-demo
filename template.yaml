AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Demo: API Gateway Lambda Authorizers with Cisco Duo
  - Demo 1: Passcode-based auth via Duo Auth API
  - Demo 2: OIDC Universal Prompt with JWT
  - Demo 3: Duo SSO as full IdP (Generic OIDC RP)
  - Demo 4: Duo SSO + PKCE (frontend-only auth, RS256 JWT)
  - Demo 5: Cognito + Duo SSO Federation (no Lambda authorizer)
  - Demo 6: Traditional Username/Password Auth with JWT

Parameters:
  # ---- Demo 1: Duo Auth API (passcode) ----
  DuoIntegrationKey:
    Type: String
    Description: Duo Auth API Integration Key (IKEY)
  DuoSecretKey:
    Type: String
    Description: Duo Auth API Secret Key (SKEY)
    NoEcho: true
  DuoApiHostname:
    Type: String
    Description: Duo Auth API Hostname (e.g. api-XXXXXXXX.duosecurity.com)

  # ---- Demo 2: Duo OIDC / Web SDK ----
  DuoOidcClientId:
    Type: String
    Description: Duo Web SDK Client ID (from Application Catalog → Web SDK)
  DuoOidcClientSecret:
    Type: String
    Description: Duo Web SDK Client Secret
    NoEcho: true
  DuoOidcApiHost:
    Type: String
    Description: Duo Web SDK API Hostname
  JwtSecret:
    Type: String
    Description: Secret key for signing JWTs (any random string)
    NoEcho: true
  FrontendUrl:
    Type: String
    Description: URL of the frontend page (e.g. http://localhost:8000/index.html or S3 URL)
    Default: http://localhost:8000/index.html

  # ---- Demo 3: Duo SSO (Generic OIDC Relying Party) ----
  DuoSsoClientId:
    Type: String
    Description: Duo SSO Generic OIDC Relying Party Client ID
    Default: ""
  DuoSsoClientSecret:
    Type: String
    Description: Duo SSO Generic OIDC Relying Party Client Secret
    NoEcho: true
    Default: ""
  DuoSsoIssuer:
    Type: String
    Description: Duo SSO Issuer URL (e.g. https://sso-XXXXXXXX.sso.duosecurity.com/oidc/DIXXXXXXXXXX)
    Default: ""
  SsoFrontendUrl:
    Type: String
    Description: URL of the SSO frontend page
    Default: http://localhost:8000/sso.html

  # ---- Demo 4: Duo SSO + PKCE (frontend-only auth) ----
  DuoPkceClientId:
    Type: String
    Description: Duo SSO Generic OIDC RP Client ID (same app, PKCE enabled)
    Default: ""
  DuoPkceIssuer:
    Type: String
    Description: Duo SSO Issuer URL (same as Demo 3 if reusing the app)
    Default: ""

  # ---- Demo 5: Cognito + Duo SSO Federation ----
  # Reuses DuoSsoClientId / DuoSsoClientSecret / DuoSsoIssuer from Demo 3.
  CognitoDomainPrefix:
    Type: String
    Description: Unique prefix for Cognito Hosted UI domain (e.g. duo-demo-yourname). Leave blank to skip Demo 5.
    Default: ""
    AllowedPattern: "^$|^[a-z0-9](?:[a-z0-9\\-]{0,61}[a-z0-9])?$"

  # ---- Demo 6: Legacy Username/Password Auth ----
  # Reuses JwtSecret from Demo 2/3.
  TokenExpiry:
    Type: Number
    Description: "Demo 6: JWT token expiry in seconds"
    Default: 3600

Conditions:
  DeployCognitoDemo: !Not [!Equals [!Ref CognitoDomainPrefix, ""]]

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12

Resources:

  # ==========================================================
  # DEMO 1: Passcode-based auth via Duo Auth API
  # ==========================================================

  DemoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: demo1-duo-passcode-mfa
      StageName: Prod
      Auth:
        DefaultAuthorizer: DuoLambdaAuthorizer
        Authorizers:
          DuoLambdaAuthorizer:
            FunctionPayloadType: TOKEN
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            AuthorizationResultTtlInSeconds: 0
            Identity:
              Header: Authorization

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/authorizer/
      Handler: app.handler
      Environment:
        Variables:
          DUO_IKEY: !Ref DuoIntegrationKey
          DUO_SKEY: !Ref DuoSecretKey
          DUO_HOST: !Ref DuoApiHostname

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hello/
      Handler: app.handler
      Events:
        HelloApi:
          Type: Api
          Properties:
            RestApiId: !Ref DemoApi
            Path: /hello
            Method: get

  # ==========================================================
  # DEMO 2: OIDC Universal Prompt with JWT authorizer
  # ==========================================================

  OidcApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: demo2-duo-oidc-2fa
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      Auth:
        Authorizers:
          JwtLambdaAuthorizer:
            FunctionPayloadType: TOKEN
            FunctionArn: !GetAtt JwtAuthorizerFunction.Arn
            AuthorizationResultTtlInSeconds: 0
            Identity:
              Header: Authorization

  # Login Lambda — handles /oidc/login and /oidc/duo-callback
  DuoOidcFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/duo_oidc/
      Handler: app.handler
      Timeout: 60
      Environment:
        Variables:
          DUO_CLIENT_ID: !Ref DuoOidcClientId
          DUO_CLIENT_SECRET: !Ref DuoOidcClientSecret
          DUO_API_HOST: !Ref DuoOidcApiHost
          JWT_SECRET: !Ref JwtSecret
          FRONTEND_URL: !Ref FrontendUrl
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref OidcApi
            Path: /oidc/login
            Method: post
        DuoCallback:
          Type: Api
          Properties:
            RestApiId: !Ref OidcApi
            Path: /oidc/duo-callback
            Method: get

  # JWT Authorizer Lambda
  JwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/jwt_authorizer/
      Handler: app.handler
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret

  # Protected endpoint (behind JWT authorizer)
  OidcProtectedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hello/
      Handler: app.handler
      Events:
        ProtectedApi:
          Type: Api
          Properties:
            RestApiId: !Ref OidcApi
            Path: /oidc/protected
            Method: get
            Auth:
              Authorizer: JwtLambdaAuthorizer

  # ==========================================================
  # DEMO 3: Duo SSO as full IdP (Generic OIDC Relying Party)
  # ==========================================================

  SsoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: demo3-duo-sso-full-idp
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      Auth:
        Authorizers:
          SsoJwtAuthorizer:
            FunctionPayloadType: TOKEN
            FunctionArn: !GetAtt SsoJwtAuthorizerFunction.Arn
            AuthorizationResultTtlInSeconds: 0
            Identity:
              Header: Authorization

  DuoSsoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/duo_sso/
      Handler: app.handler
      Timeout: 60
      Environment:
        Variables:
          DUO_SSO_CLIENT_ID: !Ref DuoSsoClientId
          DUO_SSO_CLIENT_SECRET: !Ref DuoSsoClientSecret
          DUO_SSO_ISSUER: !Ref DuoSsoIssuer
          JWT_SECRET: !Ref JwtSecret
          FRONTEND_URL: !Ref SsoFrontendUrl
      Events:
        SsoLogin:
          Type: Api
          Properties:
            RestApiId: !Ref SsoApi
            Path: /sso/login
            Method: post
        SsoCallback:
          Type: Api
          Properties:
            RestApiId: !Ref SsoApi
            Path: /sso/callback
            Method: get

  SsoJwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/jwt_authorizer/
      Handler: app.handler
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret

  SsoProtectedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hello/
      Handler: app.handler
      Events:
        SsoProtectedApi:
          Type: Api
          Properties:
            RestApiId: !Ref SsoApi
            Path: /sso/protected
            Method: get
            Auth:
              Authorizer: SsoJwtAuthorizer

  # ==========================================================
  # DEMO 4: Duo SSO + PKCE (frontend-only auth, RS256 JWT)
  # ==========================================================

  PkceApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: demo4-duo-sso-pkce
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      Auth:
        Authorizers:
          DuoRs256Authorizer:
            FunctionPayloadType: TOKEN
            FunctionArn: !GetAtt DuoJwtAuthorizerFunction.Arn
            AuthorizationResultTtlInSeconds: 0
            Identity:
              Header: Authorization

  DuoJwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/duo_jwt_authorizer/
      Handler: app.handler
      Timeout: 10
      Environment:
        Variables:
          DUO_SSO_ISSUER: !Ref DuoPkceIssuer
          DUO_SSO_CLIENT_ID: !Ref DuoPkceClientId

  PkceProtectedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hello/
      Handler: app.handler
      Events:
        PkceProtectedApi:
          Type: Api
          Properties:
            RestApiId: !Ref PkceApi
            Path: /pkce/protected
            Method: get
            Auth:
              Authorizer: DuoRs256Authorizer

  # ==========================================================
  # DEMO 5: Cognito + Duo SSO Federation (no Lambda authorizer)
  # Cognito federates to Duo SSO via OIDC, issues its own tokens,
  # API Gateway validates them natively. Only deployed when
  # CognitoDomainPrefix is set.
  # ==========================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: DeployCognitoDemo
    Properties:
      UserPoolName: duo-cognito-demo-pool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: DeployCognitoDemo
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  DuoIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: DeployCognitoDemo
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: DuoSSO
      ProviderType: OIDC
      ProviderDetails:
        client_id: !Ref DuoSsoClientId
        client_secret: !Ref DuoSsoClientSecret
        oidc_issuer: !Ref DuoSsoIssuer
        attributes_request_method: GET
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: DeployCognitoDemo
    DependsOn: DuoIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: duo-cognito-demo-client
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - http://localhost:8000/cognito-callback.html
      LogoutURLs:
        - http://localhost:8000/cognito-callback.html
      SupportedIdentityProviders:
        - DuoSSO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoApi:
    Type: AWS::Serverless::Api
    Condition: DeployCognitoDemo
    Properties:
      Name: demo5-cognito-federation
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  CognitoProtectedFunction:
    Type: AWS::Serverless::Function
    Condition: DeployCognitoDemo
    Properties:
      CodeUri: src/hello/
      Handler: app.handler
      Events:
        ProtectedApi:
          Type: Api
          Properties:
            RestApiId: !Ref CognitoApi
            Path: /cognito/protected
            Method: get

  # ==========================================================
  # DEMO 6: Traditional Username/Password Auth with JWT
  # No Duo — shows the token-exchange pattern with a legacy API.
  # ==========================================================

  LegacyApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: demo6-legacy-auth
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      Auth:
        DefaultAuthorizer: LegacyJwtAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          LegacyJwtAuthorizer:
            FunctionPayloadType: TOKEN
            FunctionArn: !GetAtt LegacyJwtAuthorizerFunction.Arn
            AuthorizationResultTtlInSeconds: 300
            Identity:
              Header: Authorization

  LegacyLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/legacy_login/
      Handler: app.handler
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          TOKEN_EXPIRY_SECONDS: !Ref TokenExpiry
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref LegacyApi
            Path: /legacy/login
            Method: post
            Auth:
              Authorizer: NONE

  LegacyJwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/jwt_authorizer/
      Handler: app.handler
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret

  LegacyProtectedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hello/
      Handler: app.handler
      Events:
        LegacyProtectedApi:
          Type: Api
          Properties:
            RestApiId: !Ref LegacyApi
            Path: /legacy/protected
            Method: get

Outputs:
  # Demo 1
  PasscodeApiUrl:
    Description: "Demo 1: Passcode-based API (Duo Auth API)"
    Value: !Sub "https://${DemoApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello"

  # Demo 2
  OidcLoginUrl:
    Description: "Demo 2: OIDC login endpoint"
    Value: !Sub "https://${OidcApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/oidc/login"
  OidcProtectedUrl:
    Description: "Demo 2: JWT-protected endpoint"
    Value: !Sub "https://${OidcApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/oidc/protected"
  OidcApiBase:
    Description: "Demo 2: API base URL (set this in frontend/index.html)"
    Value: !Sub "https://${OidcApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  # Demo 3
  SsoLoginUrl:
    Description: "Demo 3: SSO login endpoint"
    Value: !Sub "https://${SsoApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/sso/login"
  SsoCallbackUrl:
    Description: "Demo 3: SSO callback URL (add this to Duo SSO Redirect URIs)"
    Value: !Sub "https://${SsoApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/sso/callback"
  SsoProtectedUrl:
    Description: "Demo 3: SSO JWT-protected endpoint"
    Value: !Sub "https://${SsoApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/sso/protected"
  SsoApiBase:
    Description: "Demo 3: SSO API base URL (set this in frontend/sso.html)"
    Value: !Sub "https://${SsoApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  # Demo 4
  PkceProtectedUrl:
    Description: "Demo 4: PKCE JWT-protected endpoint"
    Value: !Sub "https://${PkceApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/pkce/protected"
  PkceApiBase:
    Description: "Demo 4: PKCE API base URL (set this in frontend/sso-pkce.html)"
    Value: !Sub "https://${PkceApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  # Demo 5 (only when CognitoDomainPrefix is set)
  CognitoApiBase:
    Condition: DeployCognitoDemo
    Description: "Demo 5: API base URL (set this in frontend/cognito-callback.html)"
    Value: !Sub "https://${CognitoApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  CognitoProtectedUrl:
    Condition: DeployCognitoDemo
    Description: "Demo 5: Cognito-protected endpoint"
    Value: !Sub "https://${CognitoApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/cognito/protected"
  CognitoHostedUiUrl:
    Condition: DeployCognitoDemo
    Description: "Demo 5: Cognito Hosted UI login URL"
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=openid+email+profile&redirect_uri=http://localhost:8000/cognito-callback.html"
  CognitoTokenUrl:
    Condition: DeployCognitoDemo
    Description: "Demo 5: Cognito token endpoint"
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
  CognitoUserPoolId:
    Condition: DeployCognitoDemo
    Description: "Demo 5: Cognito User Pool ID"
    Value: !Ref UserPool
  CognitoUserPoolClientId:
    Condition: DeployCognitoDemo
    Description: "Demo 5: Cognito App Client ID"
    Value: !Ref UserPoolClient
  CognitoDuoCallbackUrl:
    Condition: DeployCognitoDemo
    Description: "Demo 5: Add this as Sign-In Redirect URL in the Duo SSO app"
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"

  # Demo 6
  LegacyApiBase:
    Description: "Demo 6: API base URL (set this in frontend/legacy-login.html)"
    Value: !Sub "https://${LegacyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  LegacyLoginUrl:
    Description: "Demo 6: Login endpoint"
    Value: !Sub "https://${LegacyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/legacy/login"
  LegacyProtectedUrl:
    Description: "Demo 6: JWT-protected endpoint"
    Value: !Sub "https://${LegacyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/legacy/protected"
